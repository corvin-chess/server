name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corvin
          POSTGRES_PASSWORD: corvin_dev_only_change_me
          POSTGRES_DB: corvin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corvin -d corvin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://corvin:corvin_dev_only_change_me@localhost:5432/corvin
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Protocol contract
        run: cargo test --locked --test protocol_contract
      - name: Verify README
        run: node scripts/verify-readme.mjs
      - name: Verify Dockerfile
        run: node scripts/verify-dockerfile.mjs

[package]
name = "corvin-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Corvin real-time game server: lobby, rated play, tournaments, and HTTP API"
repository = "https://github.com/corvin-chess/server"
readme = "README.md"
keywords = ["chess", "server", "axum"]
categories = ["games"]
publish = false

[[bin]]
name = "corvin-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "ws"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "json", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
ulid = "1"
url = "2"
uuid = { version = "1", features = ["serde"] }
webauthn-rs = { version = "0.6.2", default-features = false, features = ["danger-allow-state-serialisation"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }
